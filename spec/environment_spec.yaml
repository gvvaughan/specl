describe environments:
- before:
    overridden_symbol = false
    defined_outer_symbol = true
    _G.global_scope = false

- it cannot find undefined symbols:
    expect (undefined_symbol).to_be (nil)
- it can find a symbol in the current scope:
    in_the_same_example = true
    overridden_symbol = true
    expect (in_the_same_example).to_be (true)
- it cannot find a symbol from a sibling example:
    expect (in_the_same_example).to_be (nil)
- it gets a clean environment for each example:
    expect (overridden_symbol).to_be (false)
- it can find a symbol from the current before block:
    expect (defined_outer_symbol).to_be (true)
- it cannot find symbols defined in an inner scope:
    expect (defined_inner_symbol).to_be (nil)

- context do not leak references:
  - before:
      in_sibling_before = true
      path = "./?.lua"
  - it can change library table elements locally:
      package.path = path
      expect (package.path).to_be (path)
  - it can change _G elements locally:
      _G.os.exit = false
      expect (_G.os.exit).to_be (false)
  - it gets fresh library tables in each example:
      expect (package.path).not_to_be (path)
  - it gets a fresh _G table in each example:
      expect (_G.os.exit).not_to_be (false)

- context when looking up symbols from a nested context:
    - before:
        overridden_symbol = "overridden"
        defined_inner_symbol = true
        from_sibling_before = in_sibling_before or false
    - it cannot find undefined symbols:
        expect (undefined_outer_symbol).to_be (nil)
    - it can find a symbol in global scope:
        expect (_G.global_scope).to_be (false)
    - it can find a symbol in an outer scope:
        expect (defined_outer_symbol).to_be (true)
    - it can find a symbol in the current scope:
        in_the_nested_example = true
        defined_inner_symbol = false
        expect (defined_inner_symbol).to_be (false)
    - it cannot find a symbol from a sibling example:
        expect (in_the_nested_example).to_be (nil)
    - it cannot see symbol changes from a sibling example:
        expect (defined_inner_symbol).to_be (true)
    - it cannot find a symbol from a parent example:
        expect (in_the_same_example).to_be (nil)
    - it cannot find a symbol from a sibling before:
        expect (in_sibling_before).to_be (nil)
        expect (from_sibling_before).to_be (false)
    - it gets a clean environment for each example:
        expect (overridden_symbol).to_be ("overridden")
    - it can find a symbol from the current before block:
        expect (defined_inner_symbol).to_be (true)
    - it can find a symbol from the parent before block:
        expect (defined_outer_symbol).to_be (true)

- context when looking up symbols from a nested before block:
    - before:
        defined_outer_symbol_reference = defined_outer_symbol
        undefined_outer_symbol_reference = undefined_outer_symbol

    - it can find a symbol in an outer scope:
        expect (defined_outer_symbol_reference).to_be (true)
    - it cannot find a symbol in a cousin example:
        expect (in_the_nested_example).to_be (nil)
    - it cannot find a symbol in a sibling context:
        expect (defined_inner_symbol).to_be (nil)

- context when mutating a symbol value:
    - before:
        _G.inner_global = nil
        mutated_outer_symbol = false

    - it can mutate a symbol in the current scope:
        mutated_inner_symbol = false
        mutated_inner_symbol = true
        expect (mutated_inner_symbol).to_be (true)
    - it can mutate a symbol in an outer scope:
        mutated_outer_symbol = true
        expect (mutated_outer_symbol).to_be (true)
    - it can mutate a symbol in global scope:
        _G.inner_global = true
        expect (_G.inner_global).to_be (true)
    - it can mutate a global symbol instantiated by before block:
        _G.global_scope = true
        expect (_G.global_scope).to_be (true)

- describe require:
    - before: |
        mutated_outer_symbol = false

        function requirestring (s)
          local f = os.tmpname ()
          local d = f:gsub ("/[^/]*$", "", 1)
          local h = io.open (f, "w")

          h:write (s)
          h:close ()
          package.path = d .. "/?;" .. package.path
          require (f:gsub ("^.*/", ""))
          os.remove (f)
        end

    - it can mutate a symbol in global scope:
        requirestring "_G.global_scope = 'required'"
        expect (_G.global_scope).to_be "required"
    - it can shadow a symbol in an outer scope:
        requirestring "mutated_outer_symbol = true"
        expect (mutated_outer_symbol).to_be (true)
    - it can mutate a symbol in the current scope:
        requirestring "mutated_inner_symbol = true"
        expect (mutated_inner_symbol).to_be (true)
        mutated_inner_symbol = false
        requirestring "mutated_inner_symbol = true"
        expect (mutated_inner_symbol).to_be (true)
    - it supports requiring core modules:
        expect (type (require "os")).to_be "table"
        expect (type (require "io".open)).to_be "function"
    - context with a module that specl itself loaded:
      - before: |
          dir = Tmpdir ()
          package.path = dir.path .. "/?.lua;" .. package.path
      - after:
          dir:remove ()
      - it loads the module from package.path: |
          -- specl's loader and expect modules always load luamacro.
          f = dir:file ("macro.lua", "return 'from package.path'")
          expect (require "macro").to_be "from package.path"
          f:remove ()
      - it shares specl's own modules with the examples: |
          d = dir:subdir "specl"
          f = d:file ("badargs.lua", "return 'from package.path'")
          expect (type (require "specl.badargs".diagnose)).to_be "function"
          f:remove () d:remove ()
      - it doesn't share a module that isn't on package.path: |
          -- specl's loader always loads lyaml's yaml module.
          package.path, package.cpath = dir.path .. "/?.lua", ""
          expect ((pcall (require, "yaml"))).to_be (false)
    - context in a project tree:
      - before: |
          tree, dir = Tmpdir (), Tmpdir ()
          lib = tree:subdir "lib"
          files = {
            lib:file ("tested.lua", "return 'from the current tree'"),
            dir:file ("tested.lua", "return 'from package.path'"),
            dir:file ("dependency.lua", "return 'from package.path'"),
          }
          pwd = os.getenv "PWD"
          function run_in_tree (example)
            return spawn_specl {
              "cd '" .. tree.path .. "' && '" .. pwd .. "/bin/specl' --color=no";
              stdin = "describe x:\n- it requires: " .. example .. "\n",
              env = {
                LUA_PATH = dir.path .. "/?.lua;" .. pwd .. "/lib/?.lua;" .. package.path,
              },
            }
          end
      - after: |
          for _, f in ipairs (files) do f:remove () end
          lib:remove () tree:remove () dir:remove ()
      - it loads a module from the current tree before package.path: |
          expect (run_in_tree "expect (require 'tested').to_be 'from the current tree'").
            to_succeed ()
      - it loads a C module from the current tree before package.cpath: |
          local ext = package.cpath:match "%?(%.%w+)"
          files[#files + 1] = lib:file ("broken" .. ext, "not a C module")
          expect (run_in_tree ("expect (require 'broken').to_raise './lib/broken" ..
                               ext .. "'")).to_succeed ()
      - it falls back to package.path for a module not in the current tree: |
          expect (run_in_tree "expect (require 'dependency').to_be 'from package.path'").
            to_succeed ()
    - context with a luarocks wrapper:
      - before: |
          base = Tmpdir ()
          rocks, dir = base:subdir "rocks", base:subdir "path"
          own = rocks:subdir "specl"
          files = {
            rocks:file ("installed.lua", "return 'from the specl tree'"),
            own:file ("needy.lua", "return require 'installed'"),
            dir:file ("dependency.lua", "return 'from LUA_PATH'"),
          }
          -- Like a luarocks wrapper, run specl with the tree it was
          -- installed in, which holds its own modules, first.
          local i = -1
          while arg[i - 1] do i = i - 1 end
          pwd = os.getenv "PWD"
          tree = rocks.path .. "/?.lua;" .. pwd .. "/lib/?.lua;" .. package.path
          function run_wrapped (lua_path, example)
            return spawn_specl {
              "'" .. arg[i] .. "' -e \"package.path='" .. tree .. ";'..package.path\" '" ..
                pwd .. "/bin/specl' --color=no";
              stdin = "describe x:\n- it requires: " .. example .. "\n",
              env = {LUA_PATH = lua_path},
            }
          end
      - after: |
          for _, f in ipairs (files) do f:remove () end
          own:remove () rocks:remove () dir:remove () base:remove ()
      - it doesn't search the tree the wrapper added: |
          expect (run_wrapped (dir.path .. "/?.lua",
            "expect (require 'installed').to_raise ()")).to_succeed ()
      - it searches LUA_PATH: |
          expect (run_wrapped (dir.path .. "/?.lua",
            "expect (require 'dependency').to_be 'from LUA_PATH'")).to_succeed ()
      - it keeps specl's search path for a LUA_PATH with a default path: |
          expect (run_wrapped (dir.path .. "/?.lua;;",
            "expect (require 'installed').to_be 'from the specl tree'")).to_succeed ()
      - it finds specl's own modules where specl found the rest: |
          expect (run_wrapped (dir.path .. "/?.lua",
            "expect (type (require 'specl.shell'.spawn)).to_be 'function'")).to_succeed ()
      - it finds specl's own modules with an empty LUA_PATH: |
          expect (run_wrapped ("",
            "expect (type (require 'specl.shell'.spawn)).to_be 'function'")).to_succeed ()
      - it finds the dependencies of specl's own modules where specl found them: |
          expect (run_wrapped (dir.path .. "/?.lua",
            "expect (require 'specl.needy').to_be 'from the specl tree'")).to_succeed ()

- describe load:
    - before:
        mutated_outer_symbol = false

    - it diagnoses unloadable argument:
        _, err = load "x="
        expect (err).to_contain "unexpected symbol"
    - it can mutate a symbol in the current scope:
        mutated_inner_symbol = false
        assert (load "mutated_inner_symbol = true")()
        expect (mutated_inner_symbol).to_be (true)
    - it can mutate a symbol in an outer scope:
        assert (load "mutated_outer_symbol = true")()
        expect (mutated_outer_symbol).to_be (true)
    - it can mutate a symbol in global scope:
        _G.global_scope = nil
        assert (load "_G.global_scope = true")()
        expect (_G.global_scope).to_be (true)
    - it returns the chunk itself:
        f = load ("return 1", "=chunk")
        expect (debug.getinfo (f, "S").source).to_be "=chunk"
    - it passes arguments to the chunk:
        expect (select ("#", load "return ..." (1, nil, 3))).to_be (3)
    - it loads a reader function:
        local pieces = {"return ", "42"}
        f = load (function () return table.remove (pieces, 1) end)
        expect (f ()).to_be (42)
    - it honours a text mode:
        f, err = load (string.dump (function () end), "chunk", "t")
        expect (f).to_be (nil)
        expect (err).to_contain "mode"
    - it honours a binary mode:
        f, err = load ("return 1", "chunk", "b")
        expect (f).to_be (nil)
        expect (err).to_contain "mode"
    - it runs in a supplied environment:
        env = {}
        load ("x = 1", "chunk", "t", env) ()
        expect (env.x).to_be (1)
    - it keeps a replaced environment:
        f = load ("return who", "chunk", "t", {who = "first"})
        setfenv (f, {who = "second"})
        expect (f ()).to_be "second"

- describe loadfile:
    - before: |
        mutated_outer_symbol = false

        function doloadfile (s, ...)
          local f = os.tmpname ()
          local h = io.open (f, "w")

          h:write (s)
          h:close ()
          local r, err = loadfile (f, ...)
          os.remove (f)
          return r, err
        end

    - it diagnoses unloadable argument:
        _, err = doloadfile "x="
        expect (err).to_contain "unexpected symbol"
    - it can mutate a symbol in the current scope:
        mutated_inner_symbol = false
        assert (doloadfile "mutated_inner_symbol = true")()
        expect (mutated_inner_symbol).to_be (true)
    - it can mutate a symbol in an outer scope:
        assert (doloadfile "mutated_outer_symbol = true")()
        expect (mutated_outer_symbol).to_be (true)
    - it can mutate a symbol in global scope:
        _G.global_scope = nil
        assert (doloadfile "_G.global_scope = true")()
        expect (_G.global_scope).to_be (true)
    - it passes arguments to the chunk:
        expect (select ("#", doloadfile "return ..." (1, nil, 3))).to_be (3)
    - it honours a binary mode:
        f, err = doloadfile ("return 1", "b")
        expect (f).to_be (nil)
        expect (err).to_contain "mode"
    - it runs in a supplied environment:
        env = {}
        doloadfile ("x = 1", "t", env) ()
        expect (env.x).to_be (1)
    - it keeps a replaced environment:
        f = doloadfile ("return who", "t", {who = "first"})
        setfenv (f, {who = "second"})
        expect (f ()).to_be "second"

- describe dofile:
    - before: |
        mutated_outer_symbol = false

        -- Return the number of results, after removing the file.
        function dostring (s)
          local f = os.tmpname ()
          local h = io.open (f, "w")

          h:write (s)
          h:close ()
          local ok, n = pcall (function () return select ("#", dofile (f)) end)
          os.remove (f)
          if not ok then
            error (n, 0)
          end
          return n
        end

    - it diagnoses unloadable argument:
        expect (dostring "x=").to_raise "unexpected symbol"
    - it returns all results:
        expect (dostring "return 1, nil, 3").to_be (3)
    - it can mutate a symbol in the current scope:
        mutated_inner_symbol = false
        dostring "mutated_inner_symbol = true"
        expect (mutated_inner_symbol).to_be (true)
    - it can mutate a symbol in an outer scope:
        dostring "mutated_outer_symbol = true"
        expect (mutated_outer_symbol).to_be (true)
