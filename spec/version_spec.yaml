before:
  M = require 'specl.version'

specify specl.version:
- it is set:
    expect(M.VERSION).not_to_be(nil)
- it ends with the release number or the stamp of a development build:
    expect(M.VERSION).to_match.any_of {'^%d[%.%d]*$', '^[%w_.-]+/%x+$'}
- it is the version that is described:
    expect(M.optspec).to_contain(M.VERSION)
